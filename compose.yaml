services:
  assistant:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      ASSISTANT_MODE: general
      ASSISTANT_DB: /data/assistant.sqlite3
      USE_GIT_LOGIN: "false"
    volumes:
      - assistant-data:/data
    # Personal-calendar OAuth is reachable only through a local SSH tunnel.
    ports:
      - "127.0.0.1:8765:8765"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  assistant-data:
